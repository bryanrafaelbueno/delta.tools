    <title>Delta.tools — Private Browser File Converter</title>
    <script>
      // Apply the saved theme before first paint so a reload never flashes a
      // black/wrong-color screen while the JS bundle boots.
      try {
        var t = localStorage.getItem('delta_theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
